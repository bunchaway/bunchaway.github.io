<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Bunchaway - Vietnamese Dictionary with complete definitions, examples, and pronunciation in a refined space.">
    <title>Bunchaway - Vietnamese Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
        <div class="container navbar-container">
            <div class="navbar-brand">
                <a href="/" class="logo">Bunchaway</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="/" class="nav-link active"></a></li>
                <li><a href="https://daihocmo.github.io/learn-vietnamese/" target="_blank" class="nav-link">viet
                        guide</a></li>
                <li><a href="/about/" class="nav-link">about us</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dictionary-main">
        <div class="container">
            <!-- Search Header -->
            <div class="search-header">
                <h1 style="font-size: 2.5rem; margin-bottom: var(--spacing-sm);">Từ điển Tiếng Việt</h1>
                <div class="search-wrapper" style="position: relative;">
                    <div class="search-box" style="margin: 0 auto; max-width: 100%;">
                        <input type="text" id="searchInput" placeholder="Enter a Vietnamese word or phrase..."
                            autocomplete="off" aria-label="Search for Vietnamese words or phrases">
                        <button id="searchBtn">Search</button>
                    </div>
                    <div id="suggestions" class="suggestions-list"
                        style="position: absolute; top: 100%; left: 0; right: auto; width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md); max-height: 300px; overflow-y: auto; display: none; z-index: 100; box-shadow: var(--shadow-medium); text-align: left;">
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters">
                    <button class="filter-btn active" data-type="all">All</button>
                    <button class="filter-btn" data-type="mono">Monolingual</button>
                    <button class="filter-btn" data-type="bilingual">Bilingual</button>
                </div>
            </div>

            <!-- Results Layout -->
            <div class="results-layout">
                <!-- Main Results Area -->
                <div class="results-main">
                    <div id="results" class="results-area">
                        <!-- Initial State -->
                        <div class="empty-state"
                            style="text-align: center; padding: var(--spacing-xl) 0; opacity: 0.5;">
                            <h3></h3>
                            <p>Finding words with complete definitions and examples</p>
                        </div>
                    </div>
                </div>

                <!-- Sidebar -->
                <aside class="sidebar">
                    <!-- History Panel -->
                    <section class="sidebar-panel">
                        <h3 class="panel-title">History</h3>
                        <div id="historyList" class="panel-list">
                            <p class="panel-empty">No data available</p>
                        </div>
                    </section>

                    <!-- Favorites Panel -->
                    <section class="sidebar-panel">
                        <h3 class="panel-title">Favorites</h3>
                        <div id="favList" class="panel-list">
                            <p class="panel-empty">No data available</p>
                        </div>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <script src="search.js"></script>
    <script>
        // Navbar scroll effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>

</html>
